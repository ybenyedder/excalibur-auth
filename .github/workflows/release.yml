name: 🚀 Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (ex: v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-web:
    name: 🌐 Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build Next.js (standalone)
        run: bun run build
        env:
          NEXTAUTH_SECRET: build-placeholder-secret-32chars!!
          NEXTAUTH_URL: http://localhost:3000

      - name: Package standalone build
        run: |
          mkdir -p standalone-dist
          cp -r .next/standalone/. standalone-dist/
          cp -r .next/static standalone-dist/.next/static
          cp -r public standalone-dist/public
          tar -czf excalibur-auth-web-${{ github.ref_name }}.tar.gz -C standalone-dist .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: excalibur-auth-web-${{ github.ref_name }}.tar.gz

  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build static frontend for APK
        run: |
          mkdir -p /tmp/next-static-build
          cp -r . /tmp/next-static-build/app
          cd /tmp/next-static-build/app
          rm -rf src/app/api
          cat > next.config.ts << 'EOF'
          import type { NextConfig } from 'next';
          const nextConfig: NextConfig = {
            output: 'export',
            distDir: 'out-static',
            trailingSlash: true,
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
          };
          export default nextConfig;
          EOF
          bun install --frozen-lockfile
          bun x next build || true
          cp -r out-static $GITHUB_WORKSPACE/out-static 2>/dev/null || true
        env:
          NEXTAUTH_SECRET: build-placeholder
          NEXTAUTH_URL: http://localhost:3000

      - name: Create fallback HTML if build failed
        run: |
          if [ ! -d "out-static" ]; then
            mkdir -p out-static
            cat > out-static/index.html << 'EOF'
          <!DOCTYPE html>
          <html><body><h1>Excalibur Auth App Placeholder</h1></body></html>
          EOF
          fi

      - name: Setup Capacitor & build Android project
        run: |
          npm install --save @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.excalibur.auth",
            "appName": "Excalibur Auth",
            "webDir": "out-static",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap copy android

      - name: Fix Kotlin stdlib duplicate classes
        run: |
          cat >> android/gradle.properties << 'EOF'
          android.suppressKotlinVersionCompatibilityCheck=true
          kotlin.stdlib.jdk.variants.version.alignment=false
          EOF
          sed -i '/android {/i configurations.all {\n    resolutionStrategy {\n        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"\n        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"\n        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"\n    }\n}\n' android/app/build.gradle || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -30
          cd ..
          APK=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -1)
          cp "$APK" excalibur-auth-${{ github.ref_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: excalibur-auth-${{ github.ref_name }}.apk

  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-apk]
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: "🔐 Excalibur Auth ${{ github.event.inputs.version || github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            excalibur-auth-${{ github.ref_name }}.apk
            excalibur-auth-web-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
