name: 🚀 Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ─── Build Next.js web app (standalone server) ──────────────────────────────
  build-web:
    name: 🌐 Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build Next.js (standalone)
        run: bun run build
        env:
          NEXTAUTH_SECRET: build-placeholder-secret-32chars!!
          NEXTAUTH_URL: http://localhost:3000

      - name: Package standalone build
        run: |
          mkdir -p standalone-dist
          cp -r .next/standalone/. standalone-dist/
          cp -r .next/static standalone-dist/.next/static
          cp -r public standalone-dist/public
          tar -czf excalibur-auth-web-${{ github.ref_name }}.tar.gz -C standalone-dist .
          echo "✅ Web build: $(du -sh excalibur-auth-web-${{ github.ref_name }}.tar.gz)"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: excalibur-auth-web-${{ github.ref_name }}.tar.gz

  # ─── Build Android APK via Capacitor (frontend only, points to self-hosted server) ─
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Install Capacitor
        run: bun add @capacitor/core @capacitor/android

      - name: Build static frontend (no API routes)
        run: |
          # Write a minimal static config that skips API routes
          cat > next.config.static.js << 'EOF'
          /** @type {import('next').NextConfig} */
          module.exports = {
            output: 'export',
            distDir: 'out-static',
            trailingSlash: true,
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
            eslint: { ignoreDuringBuilds: true },
          };
          EOF

          # Temporarily replace next.config.ts
          mv next.config.ts next.config.ts.bak
          mv next.config.static.js next.config.ts

          # Remove dynamic API routes temporarily so static export works
          mv src/app/api src/app/api.bak

          # Build static
          bun x next build || true

          # Restore
          mv next.config.ts.bak next.config.ts
          mv src/app/api.bak src/app/api
          rm -f next.config.static.js

          echo "=== Static build output ==="
          ls -la out-static/ 2>/dev/null || echo "No out-static dir"
        env:
          NEXTAUTH_SECRET: build-placeholder
          NEXTAUTH_URL: http://localhost:3000

      - name: Setup Capacitor project
        run: |
          # Create capacitor config pointing to the static export
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.excalibur.auth",
            "appName": "Excalibur Auth",
            "webDir": "out-static",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          # Init Capacitor (non-interactive)
          bunx cap add android

          # Copy web assets
          bunx cap copy android
          echo "✅ Capacitor setup done"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -30
          cd ..
          APK=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -1)
          cp "$APK" excalibur-auth-${{ github.ref_name }}.apk
          echo "✅ APK: $(du -sh excalibur-auth-${{ github.ref_name }}.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: excalibur-auth-${{ github.ref_name }}.apk

  # ─── Create GitHub Release ───────────────────────────────────────────────────
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-apk]
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🔐 Excalibur Auth ${{ github.ref_name }}"
          body: |
            ## 🔐 Excalibur Auth ${{ github.ref_name }}

            Self-hosted zero-knowledge TOTP authenticator — Google Authenticator style.

            ### 📦 Downloads
            | Fichier | Description |
            |---------|-------------|
            | `excalibur-auth-${{ github.ref_name }}.apk` | ✅ APK Android (sideload) |
            | `excalibur-auth-web-${{ github.ref_name }}.tar.gz` | 🌐 Serveur web Next.js standalone |

            ### 📱 Installer l'APK
            1. Télécharge `excalibur-auth-${{ github.ref_name }}.apk`
            2. Active **"Sources inconnues"** dans les paramètres Android
            3. Lance l'installation

            ### 🌐 Déployer le serveur web
            ```bash
            tar xzf excalibur-auth-web-${{ github.ref_name }}.tar.gz
            node server.js
            ```

            ---
            > 🤖 Build automatique via GitHub Actions
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            excalibur-auth-${{ github.ref_name }}.apk
            excalibur-auth-web-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
