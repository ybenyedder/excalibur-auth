name: 🚀 Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ─── Build Next.js web app ──────────────────────────────────────────────────
  build-web:
    name: 🌐 Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build Next.js
        run: bun run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'build-placeholder-secret' }}
          NEXTAUTH_URL: http://localhost:3000

      - name: Package standalone build
        run: |
          tar -czf excalibur-auth-web-${{ github.ref_name }}.tar.gz \
            -C .next/standalone . \
            --exclude='.next/standalone/.next/cache'
          echo "Web build packaged ✅"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: excalibur-auth-web-${{ github.ref_name }}.tar.gz

  # ─── Build Android APK via Capacitor ────────────────────────────────────────
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build Next.js (static export for Capacitor)
        run: |
          # Patch next.config.ts for static export
          cat > next.config.static.ts << 'EOF'
          import type { NextConfig } from 'next';
          const nextConfig: NextConfig = {
            output: 'export',
            trailingSlash: true,
            images: { unoptimized: true },
          };
          export default nextConfig;
          EOF
          cp next.config.ts next.config.ts.bak
          cp next.config.static.ts next.config.ts
          bun run build || true
          cp next.config.ts.bak next.config.ts
        env:
          NEXTAUTH_SECRET: build-placeholder
          NEXTAUTH_URL: http://localhost:3000

      - name: Install Capacitor
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android
          bunx cap init "Excalibur Auth" "com.excalibur.auth" --web-dir=out
          bunx cap add android

      - name: Copy web assets to Android
        run: bunx cap copy android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             excalibur-auth-${{ github.ref_name }}.apk
          echo "APK built ✅"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: excalibur-auth-${{ github.ref_name }}.apk

  # ─── Create GitHub Release ───────────────────────────────────────────────────
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-apk]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-build

      - name: Extract changelog from tag message
        id: changelog
        run: |
          TAG_MSG=$(git tag -l --format='%(contents)' ${{ github.ref_name }} 2>/dev/null || echo "")
          if [ -z "$TAG_MSG" ]; then
            TAG_MSG="Release ${{ github.ref_name }}"
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🔐 Excalibur Auth ${{ github.ref_name }}"
          body: |
            ## 🔐 Excalibur Auth ${{ github.ref_name }}

            Self-hosted zero-knowledge TOTP authenticator — Google Authenticator style.

            ### 📦 Downloads
            | File | Description |
            |------|-------------|
            | `excalibur-auth-${{ github.ref_name }}.apk` | Android APK (debug build) |
            | `excalibur-auth-web-${{ github.ref_name }}.tar.gz` | Next.js standalone web server |

            ### 🚀 Install APK
            1. Télécharge le fichier `.apk`
            2. Active **"Sources inconnues"** dans les paramètres Android
            3. Lance l'installation

            ### 🌐 Deploy Web
            ```bash
            tar xzf excalibur-auth-web-${{ github.ref_name }}.tar.gz
            node server.js
            ```

            ${{ steps.changelog.outputs.changelog }}

            ---
            > Built automatically with GitHub Actions 🤖
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            excalibur-auth-${{ github.ref_name }}.apk
            excalibur-auth-web-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
