name: 🚀 Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ─── Build Next.js web app ──────────────────────────────────────────────────
  build-web:
    name: 🌐 Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build Next.js (standalone)
        run: bun run build
        env:
          NEXTAUTH_SECRET: build-placeholder-secret-32chars!!
          NEXTAUTH_URL: http://localhost:3000

      - name: Package standalone build
        run: |
          mkdir -p standalone-dist
          cp -r .next/standalone/. standalone-dist/
          cp -r .next/static standalone-dist/.next/static
          cp -r public standalone-dist/public
          tar -czf excalibur-auth-web-${{ github.ref_name }}.tar.gz -C standalone-dist .
          echo "✅ Web build packaged: $(du -sh excalibur-auth-web-${{ github.ref_name }}.tar.gz)"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: excalibur-auth-web-${{ github.ref_name }}.tar.gz

  # ─── Build Android APK via Capacitor ────────────────────────────────────────
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Install Capacitor CLI
        run: bun add --global @capacitor/cli

      - name: Build Next.js (static export for APK)
        run: |
          # Temporarily switch to static export mode
          cat > next.config.override.mjs << 'NEXTEOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            trailingSlash: true,
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
            eslint: { ignoreDuringBuilds: true },
          };
          export default nextConfig;
          NEXTEOF
          mv next.config.ts next.config.ts.bak
          cp next.config.override.mjs next.config.mjs
          # Run build with the mjs override
          NEXT_CONFIG_FILE=next.config.mjs bun run build || bun x next build next.config.override.mjs || true
          mv next.config.ts.bak next.config.ts
          rm -f next.config.mjs next.config.override.mjs
        env:
          NEXTAUTH_SECRET: build-placeholder-secret-32chars!!
          NEXTAUTH_URL: http://localhost:3000

      - name: Setup Capacitor & Android project
        run: |
          # Install capacitor deps
          bun add @capacitor/core @capacitor/android

          # Create capacitor.config.json
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.excalibur.auth",
            "appName": "Excalibur Auth",
            "webDir": "out",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "buildOptions": {
                "keystorePath": null,
                "keystoreAlias": null
              }
            }
          }
          EOF

          # Init and add android
          bunx cap add android
          bunx cap copy android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50
          cd ..
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -1)
          cp "$APK_PATH" excalibur-auth-${{ github.ref_name }}.apk
          echo "✅ APK built: $(du -sh excalibur-auth-${{ github.ref_name }}.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: excalibur-auth-${{ github.ref_name }}.apk

  # ─── Create GitHub Release ───────────────────────────────────────────────────
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-apk]
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🔐 Excalibur Auth ${{ github.ref_name }}"
          body: |
            ## 🔐 Excalibur Auth ${{ github.ref_name }}

            Self-hosted zero-knowledge TOTP authenticator — Google Authenticator style.

            ### 📦 Downloads
            | Fichier | Description |
            |---------|-------------|
            | `excalibur-auth-${{ github.ref_name }}.apk` | ✅ APK Android (debug) |
            | `excalibur-auth-web-${{ github.ref_name }}.tar.gz` | 🌐 Serveur web Next.js standalone |

            ### 📱 Installer l'APK
            1. Télécharge `excalibur-auth-${{ github.ref_name }}.apk`
            2. Active **"Sources inconnues"** dans les paramètres Android
            3. Lance l'installation

            ### 🌐 Déployer le serveur web
            ```bash
            tar xzf excalibur-auth-web-${{ github.ref_name }}.tar.gz
            node server.js
            ```

            ---
            > 🤖 Build automatique via GitHub Actions
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            excalibur-auth-${{ github.ref_name }}.apk
            excalibur-auth-web-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
